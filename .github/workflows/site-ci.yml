name: Site CI

on:
  push:
    paths:
      - "site/**"
      - ".github/workflows/site-ci.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site-ci.yml"
  workflow_dispatch:

jobs:
  site:
    name: typecheck / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
