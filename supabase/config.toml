# pg_net trigger on pedidos posts without a JWT. Gateway JWT would 401 every WhatsApp/push.
[functions.notify-order]
verify_jwt = false

[functions.process-ai-image-jobs]
verify_jwt = false

# Zeno Bank signed webhooks (Svix). JWT must be off — Zeno cannot send Supabase JWTs.
[functions.zeno-webhook]
verify_jwt = false

# Authenticated merchants create checkouts; JWT verified inside the function.
[functions.create-zeno-checkout]
verify_jwt = true

# pg_cron worker: subscription grace + Zeno reconcile. Secret header, no JWT.
[functions.billing-lifecycle]
verify_jwt = false
