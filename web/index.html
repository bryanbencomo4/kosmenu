<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="elmenuxfa.com - Menu digital para restaurantes.">
  <meta name="theme-color" content="#5B21B6">
  <meta name="color-scheme" content="only light">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="elmenuxfa.com">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>elmenuxfa.com</title>
  <link rel="manifest" href="manifest.json">
  <!-- Instant brand paint: preload logo before Flutter JS. -->
  <link rel="preload" href="branding/isotipo.png" as="image" type="image/png">
  <style>
    /* Never show a white document while the 17MB bundle downloads. */
    html, body {
      margin: 0;
      min-height: 100%;
      background: #5B21B6;
      color: #F4ECFF;
    }
    #elmx-boot-shell {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #5B21B6;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    #elmx-boot-shell[hidden] {
      display: none !important;
    }
    #elmx-boot-shell .elmx-boot-inner {
      text-align: center;
      padding: 16px;
    }
    #elmx-boot-shell img {
      width: min(36vw, 160px);
      height: auto;
      max-width: 160px;
      display: block;
      margin: 0 auto 18px;
      object-fit: contain;
    }
    #elmx-boot-shell .elmx-boot-title {
      font-size: clamp(28px, 8vw, 38px);
      font-weight: 900;
      letter-spacing: -0.8px;
    }
    /* Flutter host can flash white; keep host purple until first paint. */
    flt-glass-pane,
    flutter-view,
    flt-scene-host {
      background: #5B21B6 !important;
    }
  </style>
  <script src="boot-fast.js"></script>

  <script>
    // Load Maps/Places once, only when a map or place lookup is requested.
    var elmenuxfaMapsReady = null;
    function ensureElmenuxfaMaps() {
      if (
        window.google &&
        window.google.maps &&
        window.google.maps.places &&
        window.google.maps.Geocoder
      ) {
        return Promise.resolve();
      }
      if (elmenuxfaMapsReady) return elmenuxfaMapsReady;

      elmenuxfaMapsReady = new Promise(function (resolve, reject) {
        var script = document.createElement('script');
        var started = Date.now();
        var settled = false;
        var finish = function () {
          if (
            window.google &&
            window.google.maps &&
            window.google.maps.places &&
            window.google.maps.Geocoder
          ) {
            settled = true;
            resolve();
            return;
          }
          if (Date.now() - started > 15000) {
            settled = true;
            elmenuxfaMapsReady = null;
            reject(new Error('Google Maps/Places unavailable'));
            return;
          }
          setTimeout(finish, 40);
        };
        script.async = true;
        script.src = 'https://maps.googleapis.com/maps/api/js?key=AIzaSyB9WNMyQma0-n4sMXN_lWJwYNxxkWDEmyQ&libraries=places&loading=async';
        script.onload = finish;
        script.onerror = function () {
          if (settled) return;
          settled = true;
          elmenuxfaMapsReady = null;
          reject(new Error('Google Maps script failed to load'));
        };
        document.head.appendChild(script);
        setTimeout(finish, 40);
      });
      return elmenuxfaMapsReady;
    }

    // Thin bridge so Flutter web can use Places/Geocoder without dart:io HttpClient.
    window.__elmenuxfaPlaces = {
      whenReady: function () {
        return ensureElmenuxfaMaps();
      },
      autocomplete: function (input, lat, lng, radiusMeters) {
        var self = this;
        return self.whenReady().then(function () {
          return new Promise(function (resolve, reject) {
            var service = new google.maps.places.AutocompleteService();
            var request = { input: input, language: 'es' };
            if (typeof lat === 'number' && typeof lng === 'number') {
              request.location = new google.maps.LatLng(lat, lng);
              request.radius = typeof radiusMeters === 'number' ? radiusMeters : 30000;
            }
            service.getPlacePredictions(request, function (predictions, status) {
              if (
                status === google.maps.places.PlacesServiceStatus.OK ||
                status === google.maps.places.PlacesServiceStatus.ZERO_RESULTS
              ) {
                resolve(
                  (predictions || []).map(function (item) {
                    return {
                      placeId: item.place_id || '',
                      description: item.description || '',
                    };
                  })
                );
                return;
              }
              reject(new Error(String(status || 'UNKNOWN')));
            });
          });
        });
      },
      details: function (placeId) {
        var self = this;
        return self.whenReady().then(function () {
          return new Promise(function (resolve, reject) {
            var attr = document.createElement('div');
            var service = new google.maps.places.PlacesService(attr);
            service.getDetails(
              {
                placeId: placeId,
                fields: ['formatted_address', 'address_components', 'geometry', 'name', 'types'],
                language: 'es',
              },
              function (place, status) {
                if (status !== google.maps.places.PlacesServiceStatus.OK || !place) {
                  reject(new Error(String(status || 'UNKNOWN')));
                  return;
                }
                var loc = place.geometry && place.geometry.location;
                resolve({
                  formatted_address: place.formatted_address || place.name || '',
                  address_components: (place.address_components || []).map(function (c) {
                    return {
                      long_name: c.long_name,
                      short_name: c.short_name,
                      types: c.types || [],
                    };
                  }),
                  geometry: {
                    location: {
                      lat: loc ? loc.lat() : null,
                      lng: loc ? loc.lng() : null,
                    },
                  },
                  types: place.types || [],
                });
              }
            );
          });
        });
      },
      reverseGeocode: function (lat, lng) {
        var self = this;
        return self.whenReady().then(function () {
          return new Promise(function (resolve, reject) {
            var geocoder = new google.maps.Geocoder();
            geocoder.geocode(
              { location: { lat: lat, lng: lng }, language: 'es' },
              function (results, status) {
                if (
                  status === google.maps.GeocoderStatus.OK ||
                  status === 'OK'
                ) {
                  resolve(
                    (results || []).map(function (item) {
                      return {
                        formatted_address: item.formatted_address || '',
                        types: item.types || [],
                        address_components: (item.address_components || []).map(function (c) {
                          return {
                            long_name: c.long_name,
                            short_name: c.short_name,
                            types: c.types || [],
                          };
                        }),
                      };
                    })
                  );
                  return;
                }
                if (status === google.maps.GeocoderStatus.ZERO_RESULTS || status === 'ZERO_RESULTS') {
                  resolve([]);
                  return;
                }
                reject(new Error(String(status || 'UNKNOWN')));
              }
            );
          });
        });
      },
    };
  </script>
</head>
<body>
  <!-- Static brand shell in first HTML bytes (no JS required, no animation). -->
  <div id="elmx-boot-shell" aria-busy="true" aria-label="Cargando elmenuxfa">
    <div class="elmx-boot-inner">
      <img src="branding/isotipo.png" alt="" width="160" height="160" decoding="async" fetchpriority="high" />
      <div class="elmx-boot-title">elmenuxfa.com</div>
    </div>
  </div>

  <script src="merchant-notifications.js" defer></script>
  <!--
    Load Flutter with local CanvasKit so production does not depend on
    gstatic.com (CDN blocks / CSP / offline = black screen).
    Tokens below are replaced by `flutter build web`.
  -->
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    _flutter.loader.load({
      serviceWorkerSettings: {
        serviceWorkerVersion: {{flutter_service_worker_version}},
      },
      config: {
        canvasKitBaseUrl: '/canvaskit/',
      },
    });
  </script>
</body>
</html>
